<!DOCTYPE html>
<html lang="zh-tw">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login ＆ Sign up</title>
    <!-- Bootstrap icon CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body class="login-page">
    <%- include('./layout/header'); -%>

        <main class="container">
            <div class="row pt-pb-64 py-md-0 flex-md-column">
                <!-- 左側圖片 -->
                <div class="col-5 pr-24 side-image">
                    <img class="d-md-none"
                        src="https://github.com/hexschool/2022-web-layout-training/blob/main/2025-week3-4/login.png?raw=true"
                        alt="">
                    <img class="d-none d-md-block mobile-img"
                        src="https://github.com/hexschool/2022-web-layout-training/blob/main/2025-week3-4/login-sm.png?raw=true"
                        alt="">
                </div>
                <!-- 登入 -->
                <div class="col-7 Login d-flex justify-center align-items-center">
                    <div class="Login-content">
                        <h1 class="h3 h4-md mb-32">歡迎！</h1>
                        <div class="Login-form">
                            <!-- 登入 Tab -->
                            <input type="radio" name="login-tabs" id="login-tab" checked>
                            <label for="login-tab" class="h6">登入</label>

                            <!-- 註冊 Tab -->
                            <input type="radio" name="login-tabs" id="register-tab">
                            <label for="register-tab" class="h6 text-neutral-600">註冊</label>

                            <!-- 登入內容 -->
                            <div class="Login-tab-content">
                                <a href="#" class="Loginbtn mb-8 font-weight-400"><img class="p-12"
                                        src="../assets/images/facebook.svg" alt="fb">Facebook 登入</a>
                                <a href="#" class="Loginbtn mb-8 font-weight-400"><img class="p-12"
                                        src="../assets/images/apple.svg" alt="apple">Apple 登入</a>
                                <a href="#" class="Loginbtn font-weight-400"><img class="p-12"
                                        src="../assets/images/google.svg" alt="google">Google 登入</a>
                            </div>

                            <!-- 註冊內容 -->
                            <div class="Login-tab-content">
                                <a href="#" class="Loginbtn mb-8 font-weight-400"><img class="p-12"
                                        src="../assets/images/facebook.svg" alt="fb">Facebook 註冊</a>
                                <a href="#" class="Loginbtn mb-8 font-weight-400"><img class="p-12"
                                        src="../assets/images/apple.svg" alt="apple">Apple 註冊</a>
                                <a href="#" class="Loginbtn font-weight-400"><img class="p-12"
                                        src="../assets/images/google.svg" alt="google">Google 註冊</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <%- include('./layout/footer'); -%>

            <script type="module" src="../main.js"></script>
</body>

</html>
